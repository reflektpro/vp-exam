<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДЕМО · консольная главная ГУ ВП</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="console.css">
</head>
<body>
<div class="scene" aria-hidden="true"><div class="scene-photo"></div><div class="scene-veil"></div></div>
<div id="app">
  <header class="top">
    <button type="button" class="brand" id="homeMark">ГУ ВП</button>
    <p class="demo-flag">ДЕМО · фикстура, не боевой портал и не настоящие люди</p>
    <div class="modes" role="radiogroup" aria-label="Чей экран показать">
      <button type="button" class="mode" data-mode="staff" aria-checked="true" role="radio">Сотрудник</button>
      <button type="button" class="mode" data-mode="admin" aria-checked="false" role="radio">Администратор</button>
    </div>
  </header>
  <p class="hint" id="hint">Клик по разделу сразу показывает действия. На ленте стрелки ← → меняют раздел, ↓ переходит к кнопкам, Enter выполняет выбранное. Вертикальная прокрутка страницы обычная. На телефоне ленту сдвигают вбок.</p>
  <div class="rail-wrap">
    <button type="button" class="chev" id="chevL" aria-label="Предыдущий раздел">‹</button>
    <div class="rail" id="rail" tabindex="0" role="listbox" aria-label="Разделы"></div>
    <button type="button" class="chev" id="chevR" aria-label="Следующий раздел">›</button>
  </div>
  <p class="quiet" id="quiet" hidden></p>
  <section class="stage" id="stage" aria-live="polite"></section>
  <section class="sheet" id="sheet" hidden></section>
  <footer class="colophon" id="colophon"></footer>
</div>
<script src="console.js"></script>
</body>
</html>
