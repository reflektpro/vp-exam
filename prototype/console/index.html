<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип — ГУ ВП</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="emblem.svg">
<link rel="stylesheet" href="console.css">
</head>
<body>
<div class="scene" aria-hidden="true"><div class="scene-photo"></div><div class="scene-veil"></div></div>
<div id="app">
  <header class="top">
    <button type="button" class="brand" id="homeMark">
      <img src="emblem.svg" alt="" width="54" height="36">
      <span>ГУ ВП</span>
    </button>
    <a class="forms-link" id="formsLink" href="https://reflektpro.github.io/vp-raport-offline/" target="_blank" rel="noopener noreferrer">Бланки<span class="ext" aria-hidden="true">↗</span></a>
    <div class="modes" role="radiogroup" aria-label="Режим">
      <button type="button" class="mode" data-mode="staff" role="radio" aria-checked="true">Сотрудник</button>
      <button type="button" class="mode" data-mode="admin" role="radio" aria-checked="false">Администратор</button>
    </div>
  </header>
  <div class="nav">
    <button type="button" class="chev" id="chevL" aria-label="Предыдущий раздел">‹</button>
    <div class="rail" id="rail" role="listbox" aria-label="Разделы"></div>
    <button type="button" class="chev" id="chevR" aria-label="Следующий раздел">›</button>
  </div>
  <section class="stage" id="stage" hidden></section>
</div>
<script src="console.js"></script>
</body>
</html>
