<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380"><rect x="0" y="0" width="420" height="380" fill="#f4f1e8"/><text x="14" y="26" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#222" font-weight="bold">На месте вне строя</text><path d="M20 96 L400 96" stroke="#bdb6a3" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="80" cy="96" r="13" fill="#2f5f96" stroke="#222" stroke-width="2"/><text x="80" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Н</text><path d="M98 96 L131.0 96.0" stroke="#2f5f96" stroke-width="3" fill="none"/><path d="M140 96 L131.0 90.6 L131.0 101.4 Z" fill="#2f5f96"/><g transform="translate(190 60) rotate(180)"><circle cx="0" cy="0" r="12" fill="#4a6b3a" stroke="#222" stroke-width="2"/><path d="M-6 -7 L0 -15 L6 -7" stroke="#fff" stroke-width="2" fill="none"/></g><text x="214" y="64" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#55524b">военнослужащий</text><path d="M80 122 L190 122" stroke="#2f5f96" stroke-width="2" fill="none"/><path d="M80.0 115.0 L80.0 129.0" stroke="#2f5f96" stroke-width="2" fill="none"/><path d="M190.0 115.0 L190.0 129.0" stroke="#2f5f96" stroke-width="2" fill="none"/><text x="135" y="142" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2f5f96" font-weight="bold">3–4 шага</text><path d="M190 74 L190 118" stroke="#2f5f96" stroke-width="1" fill="none" stroke-dasharray="3 3"/><circle cx="350" cy="96" r="13" fill="#9db3cf" stroke="#222" stroke-width="2"/><text x="350" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Н</text><text x="14" y="168" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">За 3–4 шага — повернуться к начальнику, строевая стойка,</text><text x="14" y="185" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">смотреть в лицо; в головном уборе — руку к головному убору.</text><text x="14" y="202" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Начальник миновал — голову прямо, руку опустить.</text><path d="M10 218 L410 218" stroke="#d6cfbd" stroke-width="1" fill="none"/><text x="14" y="244" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#222" font-weight="bold">При обгоне начальника</text><path d="M20 306 L400 306" stroke="#bdb6a3" stroke-width="2" fill="none" stroke-dasharray="6 5"/><circle cx="240" cy="306" r="13" fill="#2f5f96" stroke="#222" stroke-width="2"/><text x="240" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Н</text><path d="M258 306 L291.0 306.0" stroke="#2f5f96" stroke-width="3" fill="none"/><path d="M300 306 L291.0 300.6 L291.0 311.4 Z" fill="#2f5f96"/><path d="M100 272 L142.0 272.0" stroke="#9bb08e" stroke-width="2" fill="none"/><path d="M150 272 L142.0 267.2 L142.0 276.8 Z" fill="#9bb08e"/><g transform="translate(180 272) rotate(90)"><circle cx="0" cy="0" r="11" fill="#9bb08e" stroke="#222" stroke-width="2"/><path d="M-6 -6 L0 -14 L6 -6" stroke="#fff" stroke-width="2" fill="none"/></g><g transform="translate(240 272) rotate(90)"><circle cx="0" cy="0" r="11" fill="#4a6b3a" stroke="#222" stroke-width="2"/><path d="M-6 -6 L0 -14 L6 -6" stroke="#fff" stroke-width="2" fill="none"/></g><circle cx="240" cy="272" r="17" fill="none" stroke="#b0413e" stroke-width="2"/><text x="240" y="249" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#b0413e" font-weight="bold">1</text><g transform="translate(300 272) rotate(90)"><circle cx="0" cy="0" r="11" fill="#4a6b3a" stroke="#222" stroke-width="2"/><path d="M-6 -6 L0 -14 L6 -6" stroke="#fff" stroke-width="2" fill="none"/></g><circle cx="300" cy="272" r="17" fill="none" stroke="#b0413e" stroke-width="2"/><text x="300" y="249" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#b0413e" font-weight="bold">2</text><text x="14" y="340" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#b0413e" font-weight="bold">1 — первый шаг обгона: воинское приветствие</text><text x="14" y="358" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#b0413e" font-weight="bold">2 — второй шаг: голову прямо, правую руку опустить</text></svg>
