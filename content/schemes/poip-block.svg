<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 450" width="420" height="450"><rect x="0" y="0" width="420" height="450" fill="#f4f1e8"/><text x="14" y="22" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222" font-weight="bold">Нет непреодолимого разделителя</text><rect x="0" y="34" width="420" height="120" rx="0" fill="#9a9a92" stroke="none" stroke-width="0"/><path d="M0 94 L420 94" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="14 10"/><path d="M0 34 L420 34" stroke="#666" stroke-width="3" fill="none"/><path d="M0 154 L420 154" stroke="#666" stroke-width="3" fill="none"/><g transform="translate(50 126) rotate(90)"><rect x="-10.0" y="-19.0" width="20" height="38" rx="5" fill="#3b6ea5" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-13.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(100 126) rotate(90)"><rect x="-10.0" y="-19.0" width="20" height="38" rx="5" fill="#c99a2e" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-13.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(150 126) rotate(90)"><rect x="-10.0" y="-19.0" width="20" height="38" rx="5" fill="#3b6ea5" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-13.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><path d="M176 126 L198.0 126.0" stroke="#fff" stroke-width="3" fill="none"/><path d="M206 126 L198.0 121.2 L198.0 130.8 Z" fill="#fff"/><g transform="translate(330 50) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(330 79) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(330 108) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(330 137) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><text x="210" y="176" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#b0413e" font-weight="bold">перекрыть всю дорогу — от обочины до обочины</text><text x="14" y="214" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#222" font-weight="bold">Есть непреодолимый разделитель</text><text x="14" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#55524b">(бетонные отбойники, огороженные клумбы, зелёные насаждения)</text><rect x="0" y="244" width="420" height="120" rx="0" fill="#9a9a92" stroke="none" stroke-width="0"/><rect x="0" y="298" width="420" height="12" rx="0" fill="#7fa35a" stroke="#4d6b30" stroke-width="2"/><path d="M0 244 L420 244" stroke="#666" stroke-width="3" fill="none"/><path d="M0 364 L420 364" stroke="#666" stroke-width="3" fill="none"/><g transform="translate(50 336) rotate(90)"><rect x="-10.0" y="-19.0" width="20" height="38" rx="5" fill="#3b6ea5" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-13.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(100 336) rotate(90)"><rect x="-10.0" y="-19.0" width="20" height="38" rx="5" fill="#c99a2e" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-13.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(150 336) rotate(90)"><rect x="-10.0" y="-19.0" width="20" height="38" rx="5" fill="#3b6ea5" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-13.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><path d="M176 336 L198.0 336.0" stroke="#fff" stroke-width="3" fill="none"/><path d="M206 336 L198.0 331.2 L198.0 340.8 Z" fill="#fff"/><g transform="translate(312 328) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(356 328) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(312 352) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><g transform="translate(356 352) rotate(90)"><rect x="-10.0" y="-18.0" width="20" height="36" rx="5" fill="#5a5a5a" stroke="#222" stroke-width="2"/><rect x="-7.0" y="-12.0" width="14" height="7" rx="2" fill="#2b2b2b"/></g><text x="300" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">встречное можно не перекрывать</text><text x="210" y="388" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#b0413e" font-weight="bold">колонна — не менее 3 авто; перекрытие — не менее 4 авто</text><text x="210" y="414" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#55524b">Не разделитель: металлический забор, низкий бордюр,</text><text x="210" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#55524b">неогороженные насаждения, сбиваемый забор</text></svg>
