<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420"><rect x="0" y="0" width="420" height="420" fill="#f4f1e8"/><rect x="30" y="20" width="360" height="250" rx="4" fill="#e9b3ad" stroke="#b0413e" stroke-width="4"/><text x="210" y="48" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#b0413e" font-weight="bold">За сплошным периметром забора —</text><text x="210" y="66" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#b0413e" font-weight="bold">ЗАКРЫТАЯ ТЕРРИТОРИЯ</text><rect x="60" y="92" width="90" height="60" rx="2" fill="#d9b9a8" stroke="#8a5a3c" stroke-width="2"/><rect x="270" y="92" width="90" height="60" rx="2" fill="#d9b9a8" stroke="#8a5a3c" stroke-width="2"/><rect x="60" y="182" width="70" height="60" rx="2" fill="#d9b9a8" stroke="#8a5a3c" stroke-width="2"/><text x="230" y="196" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7a2d2a">вся территория, здания,</text><text x="230" y="212" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7a2d2a">крыши, пространство</text><rect x="170" y="252" width="80" height="36" rx="3" fill="#f1dc8f" stroke="#8a6d10" stroke-width="2"/><text x="210" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5a4608" font-weight="bold">КПП</text><rect x="120" y="296" width="180" height="50" rx="3" fill="#f1dc8f" stroke="#8a6d10" stroke-width="2" stroke-dasharray="6 4"/><text x="210" y="326" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a4608" font-weight="bold">парковка перед КПП</text><rect x="186" y="346" width="48" height="74" rx="0" fill="#f1dc8f" stroke="#8a6d10" stroke-width="2"/><path d="M210 352 L210 420" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="8 6"/><text x="246" y="386" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#5a4608" font-weight="bold">подъездной</text><text x="246" y="402" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#5a4608" font-weight="bold">участок к КПП</text><text x="262" y="248" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#b0413e" font-weight="bold">крыша КПП —</text><text x="262" y="262" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#b0413e" font-weight="bold">закрытая</text><rect x="12" y="360" width="14" height="14" rx="0" fill="#e9b3ad" stroke="#b0413e" stroke-width="2"/><text x="32" y="372" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">закрытая</text><rect x="12" y="384" width="14" height="14" rx="0" fill="#f1dc8f" stroke="#8a6d10" stroke-width="2"/><text x="32" y="396" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">охраняемая</text></svg>
