<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360"><rect x="0" y="0" width="420" height="360" fill="#f4f1e8"/><rect x="40" y="40" width="260" height="240" rx="6" fill="#f1dc8f" stroke="#8a6d10" stroke-width="2" stroke-dasharray="8 5"/><rect x="90" y="90" width="160" height="140" rx="2" fill="#e9b3ad" stroke="#b0413e" stroke-width="4"/><text x="170" y="150" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#b0413e" font-weight="bold">учреждение</text><text x="170" y="168" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#b0413e">(за ограждением) —</text><text x="170" y="186" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#b0413e">вся территория</text><text x="170" y="204" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#b0413e" font-weight="bold">закрытая</text><path d="M250 250 L300 250" stroke="#5a4608" stroke-width="2" fill="none"/><path d="M250.0 243.0 L250.0 257.0" stroke="#5a4608" stroke-width="2" fill="none"/><path d="M300.0 243.0 L300.0 257.0" stroke="#5a4608" stroke-width="2" fill="none"/><text x="275" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5a4608" font-weight="bold">15 м</text><text x="170" y="62" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a4608" font-weight="bold">прилегающая территория —</text><text x="170" y="78" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a4608">15 м от ограждения</text><rect x="310" y="120" width="90" height="100" rx="3" fill="#f1dc8f" stroke="#8a6d10" stroke-width="3"/><text x="355" y="160" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a4608" font-weight="bold">огоро-</text><text x="355" y="176" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a4608" font-weight="bold">женная</text><text x="355" y="192" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#5a4608" font-weight="bold">парковка</text><rect x="12" y="300" width="14" height="14" rx="0" fill="#e9b3ad" stroke="#b0413e" stroke-width="2"/><text x="32" y="312" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">закрытая территория</text><rect x="12" y="324" width="14" height="14" rx="0" fill="#f1dc8f" stroke="#8a6d10" stroke-width="2"/><text x="32" y="336" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">охраняемая: прилегающая (15 м) и огороженная парковка</text></svg>
