<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210"><rect x="0" y="0" width="420" height="210" fill="#f4f1e8"/><text x="210" y="26" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">На сколько превышена скорость, км/ч</text><rect x="20" y="50" width="90" height="50" rx="0" fill="#cfe0b8" stroke="#7a6f55" stroke-width="2"/><text x="65.0" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">5 000 ₽</text><text x="65.0" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#55524b">не более 20</text><rect x="110" y="50" width="80" height="50" rx="0" fill="#f1dc8f" stroke="#7a6f55" stroke-width="2"/><text x="150.0" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">10 000 ₽</text><text x="150.0" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#55524b">20–40</text><rect x="190" y="50" width="110" height="50" rx="0" fill="#f0bb85" stroke="#7a6f55" stroke-width="2"/><text x="245.0" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">15 000 ₽</text><text x="245.0" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#55524b">40–80</text><rect x="300" y="50" width="100" height="50" rx="0" fill="#e9a19a" stroke="#7a6f55" stroke-width="2"/><text x="350.0" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">25 000 ₽</text><text x="350.0" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#55524b">более 80</text><text x="26" y="46" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">0</text><text x="110" y="46" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">20</text><text x="190" y="46" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">40</text><text x="300" y="46" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">80</text><text x="350" y="144" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#b0413e" font-weight="bold">или лишение</text><text x="350" y="158" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#b0413e" font-weight="bold">права управления</text><text x="210" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#55524b">Ровно 20, 40 или 80 км/ч — ступень левее («не более»)</text></svg>
